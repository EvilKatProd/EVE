async function ollamaAnywhere(messages,opts,onDelta){
if(window._eveOllamaDown&&Date.now()-(window._eveOllamaChecked||0)<20000)throw new Error('down');
const endpoint=getOllamaEndpoint();
const ctrl=new AbortController();
const timer=setTimeout(()=>ctrl.abort(),700);
let names=[];
try{
const tags=await fetch(endpoint+'/api/tags',{signal:ctrl.signal});
clearTimeout(timer);
if(!tags.ok)throw new Error('down');
const data=await tags.json();
names=(data.models||[]).map(m=>m.name||m.model).filter(Boolean);
}catch(e){
clearTimeout(timer);
window._eveOllamaDown=true;
window._eveOllamaChecked=Date.now();
throw e;
}
if(!names.length){window._eveOllamaDown=true;window._eveOllamaChecked=Date.now();throw new Error('none');}
window._eveOllamaDown=false;
ollamaModels=names;
localStorage.setItem('eve_ollama_models_cache',JSON.stringify(ollamaModels));
const model=getOllamaModelForFeature(opts.feature)||names[0];
const chatCtrl=new AbortController();
const chatTimer=setTimeout(()=>chatCtrl.abort(),120000);
const res=await fetch(endpoint+'/api/chat',{
method:'POST',
signal:chatCtrl.signal,
headers:{'content-type':'application/json'},
body:JSON.stringify({model,messages,stream:true,options:{temperature:opts.temperature!=null?opts.temperature:0.7,num_predict:opts.maxTokens||1024}})
});
clearTimeout(chatTimer);
if(!res.ok||!res.body)throw new Error('down');
const reader=res.body.getReader();const decoder=new TextDecoder();let buf='';let full='';
while(true){
const {done,value}=await reader.read();
if(done)break;
buf+=decoder.decode(value,{stream:true});
const lines=buf.split('\n');buf=lines.pop();
for(const line of lines){
if(!line.trim())continue;
try{const evt=JSON.parse(line);if(evt.message&&evt.message.content){full+=evt.message.content;onDelta(full);}}catch(e){}
}
}
if(!full.trim())throw new Error('empty');
return full;
}
function isJunkReply(text){
const t=String(text||'');
if(!t.trim())return true;
if(/on-device model is not available|echoing back the input|api key|raise the key budget|ENOSPC/i.test(t))return true;
if(/I can open your notes|Got it\. I can open|my capabilities|as an ai|language model|i am an ai|i'm an ai/i.test(t))return true;
if(/you are eve\b/i.test(t.slice(0,500)))return true;
if(/write the opening chapter|providing general legal information|providing general health and wellness/i.test(t))return true;
return false;
}
async function deviceStream(messages,onDelta){
const LM=window.LanguageModel||(window.ai&&window.ai.languageModel);
if(!LM||!LM.create)throw new Error('none');
let session;
try{
if(LM.availability){
const state=await Promise.race([Promise.resolve(LM.availability()),new Promise((_,rej)=>setTimeout(()=>rej(new Error('none')),800))]);
if(state==='unavailable'||state==='no')throw new Error('none');
}
session=await Promise.race([LM.create(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('none')),800))]);
}catch(e){throw new Error('none');}
const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n\n');
const convo=messages.filter(m=>m.role!=='system').map(m=>(m.role==='user'?'User: ':'EVE: ')+m.content).join('\n');
const prompt=(sys?sys+'\n\n':'')+convo+'\nEVE:';
let full='';
if(session.promptStreaming){
const stream=session.promptStreaming(prompt);
for await(const chunk of stream){
if(typeof chunk==='string')full=chunk.length>=full.length?chunk:full+chunk;
else if(chunk&&chunk.text)full+=chunk.text;
if(isJunkReply(full)&&full.length>40)throw new Error('none');
}
}else{
full=await session.prompt(prompt);
}
if(!full||isJunkReply(full))throw new Error('none');
onDelta(full);
return full;
}
function offlineReply(messages,onDelta){
const last=[...messages].reverse().find(m=>m.role==='user');
const txt=(last&&last.content||'').trim();
const lower=txt.toLowerCase();
const mode=localStorage.getItem('eve_chat_mode')||'collaborator';
let answer='';
if(/\b(kill myself|suicide|want to die|self-harm|end my life)\b/.test(lower)){

}else if(/\bnotes?\b/.test(lower)){

}else if(/\balarms?\b/.test(lower)){

}else if(/^[0-9.+\-*/() \t]+$/.test(txt)&&/[0-9]/.test(txt)){

}else if(/^(open|show|go to|switch to)\b/.test(lower)){

const found=TABS.find(t=>t.toLowerCase()===target)||TABS.find(t=>t.toLowerCase().includes(target)||target.includes(t.toLowerCase()));

}else if(/\b(search|look up|youtube|map|wikipedia)\b/.test(lower)){
answer=navigator.onLine?'I can open that.\nACTION: open Search':'Search, maps, and video sites are there when this computer is online. Notes, tasks, calendar, music, and video on this computer work either way.';
}else if(/^(hi|hello|hey|good morning|good evening|good night)\b/.test(lower)){
answer=mode==='spicy'?"Hey. I'm right here.":"Hey. What are we getting into?";
}else{
const sys=messages.filter(m=>m.role==='system').map(m=>m.content).join('\n');
const know=(sys.split('What you already know about them:')[1]||'').trim();
const words=lower.split(/\W+/).filter(w=>w.length>3);
const hit=know && words.some(w=>know.toLowerCase().includes(w));
if(hit){
const line=know.split('\n').find(l=>words.some(w=>l.toLowerCase().includes(w)))||know.slice(0,400);
answer=line.replace(/^[^:]+:\s*/,'').slice(0,500);

else if(mode==='spicy')answer="I heard you. I'm not going anywhere.";

}
onDelta(answer);

}

async function resizeImage(file,max=300){

img.onload=()=>{
let w=img.width,h=img.height;
if(w>max||h>max){if(w>h){h=h*max/w;w=max;}else{w=w*max/h;h=max;}}
const c=document.createElement('canvas');c.width=w;c.height=h;
c.getContext('2d').drawImage(img,0,0,w,h);
URL.revokeObjectURL(url);
try{res(c.toDataURL('image/webp',0.7));}catch{res(c.toDataURL('image/jpeg',0.6));}
};
img.onerror=()=>{URL.revokeObjectURL(url);res('');};
img.src=url;
});
}

function stripCode(s){
s=String(s||'').trim();
const m=s.match(/```[a-zA-Z0-9]*\s*([\s\S]*?)```/);
if(m)return m[1].trim();
return s.replace(/^```[a-zA-Z0-9]*\s*/,'').replace(/```$/,'').trim();
}
function looksLikeCode(s,lang){
if(!s||s.length<15)return false;
if(/No live answer|Got it\. I can open|I'm here\. What do you want|I'm with you/.test(s))return false;
if(lang==='HTML')return /<(html|body|div|button|p|h1|style|script)/i.test(s);
return /[{};=]|def |class |function |import |#include|fn |public |SELECT |package /.test(s);
}

}

});

async function queuedAudio(base,fn,data){
const sid=Math.random().toString(16).slice(2)+Date.now().toString(16);
const start=await fetch(base+'/gradio_api/queue/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data:data,fn_index:fn,session_hash:sid,trigger_id:fn}),signal:AbortSignal.timeout(20000)});
if(!start.ok)throw new Error('start');
const res=await fetch(base+'/gradio_api/queue/data?session_hash='+sid);
if(!res.ok||!res.body)throw new Error('wait');
const reader=res.body.getReader();
const dec=new TextDecoder();
let buf='';
const deadline=Date.now()+180000;
while(Date.now()<deadline){
const {value,done}=await reader.read();
if(value)buf+=dec.decode(value,{stream:true});
let hit=null;
for(const m of buf.matchAll(/data:\s*(\{.*\})/g)){
try{const o=JSON.parse(m[1]); if(o.msg==='process_completed')hit=o;}catch(e){}
}
if(hit){
try{reader.cancel();}catch(e){}
if(!hit.success)throw new Error('fail');
const item=hit.output&&hit.output.data&&hit.output.data[0];
const url=item&&(item.url||(item.path?base+'/gradio_api/file='+item.path:''));
if(!url)throw new Error('none');
return url;
}
if(done)break;
}
throw new Error('empty');
}
async function gradioCall(base,api,data){
const start=await fetch(base+'/gradio_api/call/'+api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data}),signal:AbortSignal.timeout(20000)});
if(!start.ok)throw new Error('start');
const info=await start.json();
if(!info.event_id)throw new Error('start');
const res=await fetch(base+'/gradio_api/call/'+api+'/'+info.event_id);
if(!res.ok||!res.body)throw new Error('wait');
const reader=res.body.getReader();
const dec=new TextDecoder();
let buf='';
const deadline=Date.now()+180000;
while(Date.now()<deadline){
const {value,done}=await reader.read();
if(value)buf+=dec.decode(value,{stream:true});
const blocks=[...buf.matchAll(/event:\s*complete\s*\ndata:\s*(.*)/g)];
if(blocks.length){try{reader.cancel();}catch(e){} return JSON.parse(blocks[blocks.length-1][1]);}
if(/event:\s*error/.test(buf)&&!/event:\s*complete/.test(buf))throw new Error('fail');
if(done)break;
}
throw new Error('empty');
}

function pickFemaleVoice(){
const voices=window.speechSynthesis?speechSynthesis.getVoices():[];
const score=(v)=>{
const n=(v.name+' '+(v.lang||'')+' '+(v.voiceURI||'')).toLowerCase();
let s=0;
if(/en[-_]us/.test(n)||/english.*united states/.test(n))s+=6;
else if(/^en/.test(v.lang||'')||/english/.test(n))s+=3;
if(/natural|neural|online/.test(n))s+=20;
if(/jenny/.test(n))s+=18;
if(/aria|samantha|ava|emma|michelle|sara|sonia|libby|natasha|victoria|karen|moira|serena|fiona|zira|hazel|susan|allison/.test(n))s+=12;
if(/google/.test(n)&&/female|us english/.test(n))s+=14;
if(/female|woman/.test(n))s+=8;
if(/\bmale\b|daniel|fred|david|alex\b|tom\b|george|james|rishi/.test(n)&&!/female/.test(n))s-=20;
if(/ana\b|child|boy|girl/.test(n))s-=8;
return s;
};
return voices.slice().sort((a,b)=>score(b)-score(a))[0]||null;
}

function speakLocal(text){
if(!window.speechSynthesis||!text)return;
const chunks=[];
let rest=String(text).replace(/\s+/g,' ').trim().slice(0,900);
while(rest){
if(rest.length<=180){chunks.push(rest);break;}
let cut=rest.lastIndexOf('. ',180);
if(cut<40)cut=rest.lastIndexOf(' ',180);
if(cut<40)cut=180;
chunks.push(rest.slice(0,cut+1).trim());
rest=rest.slice(cut+1).trim();
}
const sayChunk=(i)=>{
if(i>=chunks.length)return;
const u=new SpeechSynthesisUtterance(chunks[i]);
const v=pickFemaleVoice();
if(v){u.voice=v;u.lang=v.lang||'en-US';}
else u.lang='en-US';
u.pitch=1.05;
u.rate=1;
u.onend=()=>sayChunk(i+1);
try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}
};
const go=()=>{try{speechSynthesis.cancel();}catch(e){} sayChunk(0);};
if(speechSynthesis.getVoices().length)go();
else{
speechSynthesis.addEventListener('voiceschanged',go,{once:true});
setTimeout(()=>{if(!speechSynthesis.speaking)go();},400);
}
}
let eveVoiceToken=0;
function speakText(text){
const box=document.getElementById('voiceOutputToggle');
if(box&&!box.checked)return;
const clean=String(text||'').replace(/\s+/g,' ').trim().slice(0,900);
if(!clean)return;
const token=++eveVoiceToken;
const parts=[];
let rest=clean;
while(rest){
if(rest.length<=180){parts.push(rest);break;}
let cut=rest.lastIndexOf('. ',180);
if(cut<40)cut=rest.lastIndexOf(' ',180);
if(cut<40)cut=180;
parts.push(rest.slice(0,cut+1).trim());
rest=rest.slice(cut+1).trim();
}
const audio=ensureVoiceAudio();
let n=0;
let heard=false;
const localOnce=()=>{if(token!==eveVoiceToken||heard)return;heard=true;try{audio.pause();}catch(e){} speakLocal(clean);};
const next=()=>{
if(token!==eveVoiceToken||n>=parts.length)return;
const q=encodeURIComponent(parts[n]);
const urls=[
'https://translate.googleapis.com/translate_tts?client=gtx&ie=UTF-8&tl=en-US&q='+q,
'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en-US&q='+q
];
let u=0;
const timer=setTimeout(()=>{if(!heard)localOnce();},2500);
const tryOne=()=>{
if(token!==eveVoiceToken)return;
if(u>=urls.length){clearTimeout(timer);localOnce();return;}
let settled=false;
const fail=()=>{
if(settled||token!==eveVoiceToken)return;
settled=true;
u++;
tryOne();
};
audio.onplaying=()=>{
heard=true;
clearTimeout(timer);
try{speechSynthesis.cancel();}catch(e){}
};
audio.onended=()=>{if(token!==eveVoiceToken)return;n++;if(n<parts.length)next();};
audio.onerror=fail;
audio.src=urls[u];
const play=audio.play();
if(play&&play.catch)play.catch(fail);
};
tryOne();
};
if(navigator.onLine)next();
else speakLocal(clean);
}

let micStream=null;
function setVoiceMode(mode){

if(!SR){voiceMode='off';updateMicButton();return;}
const arm=()=>{
const rec=new SR();
rec.continuous=true;
rec.interimResults=true;
rec.lang='en-US';
rec.onresult=(ev)=>{
let interim='',final='';
for(let i=ev.resultIndex;i<ev.results.length;i++){
const piece=ev.results[i][0].transcript;
if(ev.results[i].isFinal)final+=piece;else interim+=piece;
}
const el=document.getElementById('voiceInterim');
if(el)el.textContent=interim;
if(!final.trim())return;
let said=final.trim();
if(mode==='wake'){
const hit=said.match(/hey[, ]*eve[, ]*(.*)/i);
if(!hit)return;
said=(hit[1]||'').trim();
if(!said){if(el)el.textContent='Listening…';return;}
}
if(el)el.textContent='';
handleVoiceCommand(said);
};
rec.onerror=(e)=>{
const err=e&&e.error;
if(err==='not-allowed'||err==='audio-capture'||err==='service-not-allowed'){
voiceMode='off';
if(window._eveRec===rec)window._eveRec=null;
updateMicButton();
}
};
rec.onend=()=>{
if(voiceMode==='off'||window._eveRec!==rec)return;
setTimeout(()=>{
if(voiceMode==='off'||window._eveRec!==rec)return;
try{rec.start();}catch(err){}
},500);
};
window._eveRec=rec;
voiceMode=mode;
try{rec.start();}catch(e){voiceMode='off';window._eveRec=null;}
updateMicButton();
};
const go=()=>arm();

}

function clockToInput(spoken){
let s=String(spoken||'').toLowerCase().replace(/\./g,'').trim();
const ap=/(am|pm)/.exec(s);
s=s.replace(/\s*(am|pm)\s*/g,' ');
let h,m=0;
const hm=s.match(/(\d{1,2})\s*[: ]\s*(\d{2})/);
const only=s.match(/(\d{1,2})/);
if(hm){h=+hm[1];m=+hm[2];}
else if(only){h=+only[1];}
else return '';
if(ap){if(ap[1]==='pm'&&h<12)h+=12;if(ap[1]==='am'&&h===12)h=0;}
if(h>23||m>59)return '';
return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}

async function gatherLiveContext(txt){
const bits=[];
const lower=txt.toLowerCase();
if(!navigator.onLine){
if(/\b(weather|forecast|temperature|how hot|how cold)\b/.test(lower)){
const saved=localStorage.getItem('eve_weather_line');
if(saved)bits.push('Last saved weather: '+saved);
}
return bits.join('\n\n');
}
if(/\b(weather|forecast|temperature|how hot|how cold)\b/.test(lower)){
try{
const d=await fetch('https://api.open-meteo.com/v1/forecast?latitude=28.5494&longitude=-81.7729&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto',{signal:AbortSignal.timeout(5000)}).then(r=>r.json());
const c=d.current;
bits.push('Live weather for Clermont, Florida: '+Math.round(c.temperature_2m)+'°F, feels like '+Math.round(c.apparent_temperature)+'°F, wind '+Math.round(c.wind_speed_10m)+' mph.');
localStorage.setItem('eve_weather_line',Math.round(c.temperature_2m)+'°F');
}catch(e){}
}
const place=txt.match(/\b(?:map|maps|where is|directions to)\s+(.+)/i);
if(place){
const q=place[1].replace(/[?.!]+$/,'').trim();
try{
const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&q='+encodeURIComponent(q)+'&limit=1',{signal:AbortSignal.timeout(5000)}).then(r=>r.json());
if(res[0])bits.push('Live map result for '+q+': '+res[0].display_name+' ('+res[0].lat+', '+res[0].lon+').');
}catch(e){}
}
const look=txt.match(/\b(?:search|look up|google|who is|what is|tell me about)\s+(.+)/i);
if(look){
const q=look[1].replace(/[?.!]+$/,'').trim();
try{
const res=await fetch('https://en.wikipedia.org/w/api.php?action=opensearch&search='+encodeURIComponent(q)+'&limit=3&namespace=0&format=json&origin=*',{signal:AbortSignal.timeout(5000)}).then(r=>r.json());
const titles=res[1]||[], blurbs=res[2]||[], links=res[3]||[];
const lines=titles.map((t,i)=>t+(blurbs[i]?': '+blurbs[i]:'')+(links[i]?' '+links[i]:'')).filter(Boolean);
if(lines.length)bits.push('Live reference results for "'+q+'":\n'+lines.join('\n'));
}catch(e){}
}
return bits.join('\n\n');
}

function kbOpen(){
return new Promise((res,rej)=>{
const req=indexedDB.open('eve_kb',1);
req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('docs'))db.createObjectStore('docs',{keyPath:'id'});};
req.onsuccess=()=>res(req.result);
req.onerror=()=>rej(req.error);
});
}
async function kbList(){
const db=await kbOpen();
return new Promise((res,rej)=>{
const tx=db.transaction('docs','readonly');
const r=tx.objectStore('docs').getAll();
r.onsuccess=()=>res((r.result||[]).sort((a,b)=>b.added-a.added));
r.onerror=()=>rej(r.error);
});
}
async function kbRemove(id){
const db=await kbOpen();
return new Promise((res,rej)=>{
const tx=db.transaction('docs','readwrite');
tx.objectStore('docs').delete(id);
tx.oncomplete=()=>res();
tx.onerror=()=>rej(tx.error);
});
}
async function kbAddFile(file){
if(!window.pdfjsLib){
await new Promise((res,rej)=>{
const t=setInterval(()=>{if(window.pdfjsLib){clearInterval(t);res();}},150);
setTimeout(()=>{clearInterval(t);rej(new Error('pdf'));},8000);
});
}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const data=await file.arrayBuffer();
const pdf=await pdfjsLib.getDocument({data}).promise;
let text='';
const pages=Math.min(pdf.numPages,40);
for(let i=1;i<=pages;i++){
const page=await pdf.getPage(i);
const content=await page.getTextContent();
text+=content.items.map(it=>it.str).join(' ')+'\n';
if(text.length>150000)break;
}
text=text.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
if(text.length<20)throw new Error('empty');
const doc={id:'k'+Date.now()+Math.floor(Math.random()*1000),name:file.name||'PDF',added:Date.now(),text:text.slice(0,150000)};
const db=await kbOpen();
await new Promise((res,rej)=>{
const tx=db.transaction('docs','readwrite');
tx.objectStore('docs').put(doc);
tx.oncomplete=()=>res();
tx.onerror=()=>rej(tx.error);
});
}
async function knowledgeFor(query){
let docs=[];
try{docs=await kbList();}catch(e){return '';}
if(!docs.length)return '';
const q=String(query||'');
const words=(q.toLowerCase().match(/[a-z0-9]{4,}/g)||[]).slice(0,24);
const scored=[];
docs.forEach(doc=>{
const bare=doc.name.replace(/\.pdf$/i,'').toLowerCase();
if(bare && q.toLowerCase().includes(bare))scored.push({score:50,name:doc.name,chunk:doc.text.slice(0,900)});
const text=doc.text;
const step=700;
for(let i=0;i<text.length && i<20000;i+=step){
const chunk=text.slice(i,i+900);
const low=chunk.toLowerCase();
let score=0;
words.forEach(w=>{if(low.includes(w))score++;});
if(score)scored.push({score,name:doc.name,chunk});
}
});
scored.sort((a,b)=>b.score-a.score);
const seen=new Set();
const picked=[];
for(const s of scored){
const key=s.name+s.chunk.slice(0,80);
if(seen.has(key))continue;
seen.add(key);
picked.push(s);
if(picked.length>=3)break;
}
if(!picked.length)return '';
return picked.map(s=>'From '+s.name+':\n'+s.chunk.trim()).join('\n\n').slice(0,3000);
}
async function memoryFor(query){
let docs=[];

const lines=[];
docs.slice(0,4).forEach(d=>lines.push(d.name.replace(/\.pdf$/i,'')+': '+d.text.replace(/\s+/g,' ').slice(0,500)));
try{
const ideas=JSON.parse(localStorage.getItem('eve_proj_ideas')||'[]');
if(ideas.length)lines.push('Projects: '+ideas.slice(0,8).map(i=>i.text).join('; '));
}catch(e){}
const notes=(localStorage.getItem('eve_notes')||'').trim();
if(notes)lines.push('Notes: '+notes.slice(0,600));
let hit='';
try{hit=await knowledgeFor(query);}catch(e){}
let out=lines.join('\n');
if(hit)out+='\n\nClosest match:\n'+hit;
return out.slice(0,3200);
}

try{const know=await memoryFor(txt);if(know)sysPrompt+='\n\nWhat you already know about them:\n'+know;}catch(e){}
const history=[{role:'system',content:sysPrompt},...chat.filter(m=>m.text&&(m.role==='user'||!isJunkReply(m.text))).slice(-12).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}))];
full=await aiStream(history,{maxTokens:700,temperature:0.8,feature:'chat',wait:26000},(partial)=>{chat[idx].text=partial;localStorage.setItem('eve_chat',JSON.stringify(chat));renderChat();});
if(full){
const actionRe=/ACTION:\s*(weather|search|map|youtube|image|open)\s*([^\n]*)/ig;
let am;
while((am=actionRe.exec(full))){
const kind=am[1].toLowerCase();
const arg=(am[2]||'').trim();
const l=txt.toLowerCase();
const asked=kind==='weather'?/\b(weather|forecast|temperature)\b/.test(l):kind==='search'?/\b(search|look up)\b/.test(l):kind==='map'?/\b(map|where is|directions)\b/.test(l):kind==='youtube'?/\b(youtube|video)\b/.test(l):kind==='image'?/\b(picture|image|draw)\b/.test(l):true;
if(asked)applyEveAction('ACTION: '+kind+' '+arg);
}
full=full.replace(actionRe,'').replace(/\n{3,}/g,'\n\n').trim();
}
if(!full){chat[idx].text='I couldn’t get a reply. Try again.';}
else{chat[idx].text=full;speakText(full);}
localStorage.setItem('eve_chat',JSON.stringify(chat));renderChat();
}catch(e){chat[idx].text='I couldn’t get a reply. Try again.';localStorage.setItem('eve_chat',JSON.stringify(chat));renderChat();}
finally{updateChatStatus();}
};

function unlockApp(){
document.getElementById('lockOverlay').style.display='none';
document.getElementById('appRoot').style.display='';
loadAvatars();renderChat();renderTab();
}
function showLockButtons(html){document.getElementById('lockButtons').innerHTML=html;}
function handleBioResult(kind,res){
const label=kind==='face'?'Face':'Voice';
if(!res.ok){document.getElementById('lockStatus').textContent=label+' check failed: '+res.error;return;}
if(res.matched===undefined){
document.getElementById('lockStatus').textContent=label+' enrolled. You can continue now.';
showLockButtons('<button class=primary id=lockContinueBtn>Continue to EVE</button>');
document.getElementById('lockContinueBtn').onclick=unlockApp;
return;
}
if(res.matched){
document.getElementById('lockStatus').textContent=label+' verified.';
setTimeout(unlockApp,400);
}else{
document.getElementById('lockStatus').textContent=label+" didn't match. Try again, or use your recovery PIN.";
}
}
function renderEnrollUI(){
document.getElementById('lockStatus').textContent="No face or voice is enrolled yet. Set up at least one so EVE recognizes you — you can add the other later from Brain.";
showLockButtons('<button class=primary id=enrollFaceBtn>Enroll Face</button><button class=primary id=enrollVoiceBtn>Enroll Voice</button>');
document.getElementById('enrollFaceBtn').onclick=()=>{document.getElementById('lockStatus').textContent='Look at the camera...';window.pyBridge.runFaceCheck('enroll');};
document.getElementById('enrollVoiceBtn').onclick=()=>{document.getElementById('lockStatus').textContent='Say a short phrase — recording for 4 seconds...';window.pyBridge.runVoiceBioCheck('enroll');};
}
function renderVerifyUI(status){
document.getElementById('lockStatus').textContent='Verify with your face or voice to unlock EVE.';
let btns='';
if(status.faceEnrolled)btns+='<button class=primary id=verifyFaceBtn>Verify Face</button>';
if(status.voiceEnrolled)btns+='<button class=primary id=verifyVoiceBtn>Verify Voice</button>';
showLockButtons(btns);
if(status.faceEnrolled)document.getElementById('verifyFaceBtn').onclick=()=>{document.getElementById('lockStatus').textContent='Look at the camera...';window.pyBridge.runFaceCheck('verify');};
if(status.voiceEnrolled)document.getElementById('verifyVoiceBtn').onclick=()=>{document.getElementById('lockStatus').textContent='Say a short phrase — recording for 4 seconds...';window.pyBridge.runVoiceBioCheck('verify');};
document.getElementById('lockRecoveryToggle').style.display=status.hasRecovery?'inline-block':'none';
}
document.getElementById('lockRecoveryToggle').onclick=()=>{
const area=document.getElementById('lockRecoveryArea');
area.style.display=area.style.display==='none'?'flex':'none';
};
document.getElementById('lockRecoverySubmit').onclick=()=>{
const pin=document.getElementById('lockRecoveryInput').value;
window.pyBridge.verifyRecoveryPin(pin,function(ok){
if(ok){document.getElementById('lockStatus').textContent='Recovery PIN accepted.';setTimeout(unlockApp,300);}
else{document.getElementById('lockStatus').textContent='That PIN is incorrect.';}
});
};
function initLock(){
if(!window.pyBridge){
setTimeout(unlockApp,0);
return;
}
window.pyBridge.biometricStatus(function(raw){
const status=JSON.parse(raw);
if(!status.faceEnrolled && !status.voiceEnrolled)renderEnrollUI();
else renderVerifyUI(status);
});
}
